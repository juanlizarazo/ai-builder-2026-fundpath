<article class="stop-card ss-card" role="article">
  <button
    class="stop-header"
    (click)="open()"
    [attr.aria-label]="'Open details for ' + stop().title"
    aria-haspopup="dialog"
  >
    <div class="stop-info">
      <div class="stop-identity">
        <span class="tier-plate tier-plate--{{ stop().fitTier }}">
          <span class="tier-icon" aria-hidden="true">{{ tierIcons[stop().fitTier] }}</span>
          <span class="tier-label">{{ tierLabels[stop().fitTier] }}</span>
        </span>
        <span class="stop-agency fp-eyebrow">{{ stop().agency }}</span>
      </div>

      <div class="stop-title">{{ stop().title }}</div>

      @if (dataStrip()) {
        <div class="stop-data-strip fp-data">{{ dataStrip() }}</div>
      }

      @if (fitChips().length > 0) {
        <div class="fit-chips">
          @for (chip of fitChips(); track chip.code) {
            <span class="fit-chip fp-meta">
              <span aria-hidden="true">{{ chip.icon }}</span>
              {{ chip.label }}
            </span>
          }
        </div>
      }

      @if (hasApplication()) {
        <div class="stop-app-bar">
          <span class="stop-app-badge">
            <mat-icon>check_circle</mat-icon>
            Application started
          </span>
          @if (hasSf424()) {
            <a
              class="stop-app-sf424"
              [routerLink]="['/route', routeId(), 'apply', stop().id]"
              [queryParams]="{ leg: 4 }"
              (click)="$event.stopPropagation()"
            >
              <mat-icon>description</mat-icon>
              View form
            </a>
          }
          <a
            class="stop-app-resume"
            [routerLink]="['/route', routeId(), 'apply', stop().id]"
            (click)="$event.stopPropagation()"
          >
            Resume →
          </a>
        </div>
      }
    </div>

    <mat-icon class="open-icon" aria-hidden="true">chevron_right</mat-icon>
  </button>
</article>
